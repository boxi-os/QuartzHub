# Source of QuartzHub.xcodeproj. The .xcodeproj is generated (scripts/xcodegen.sh) and not
# versioned: this file is the one to edit.
name: QuartzHub
options:
  bundleIdPrefix: io.github.boxios
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: de
  createIntermediateGroups: true
  groupSortPosition: top

# An Icon Composer file (.icon) is a folder; XcodeGen 2.46 does not know it and would add its
# contents one by one. As one file in the resources, actool compiles it into the app's icon.
fileTypes:
  icon:
    file: true
    buildPhase: resources

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Apple Silicon only (docs/plan.md).
    ARCHS: arm64
    # Ad hoc, like the releases: no team, no notarization.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  QuartzHubCore:
    path: Packages/QuartzHubCore

targets:
  QuartzHub:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: QuartzHubCore
        product: QuartzHubCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: QuartzHub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations: [de, en]
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "GPL-3.0-or-later"
        # The sentence under macOS's local network question; without it the question has no
        # reason, and a refusal shows up only as ssh's "No route to host". Translated in
        # App/InfoPlist.xcstrings (macOS reads it from the bundle, not from QuartzHub's catalog).
        NSLocalNetworkUsageDescription: "QuartzHub verbindet sich mit Servern in deinem Netzwerk, etwa wenn du per SFTP, rsync oder FTP veröffentlichst."
    settings:
      base:
        # Not boxi_os: CFBundleIdentifier allows letters, digits, hyphen and period only. Same form
        # as QuartzControl's macOS ID (io.github.boxios.quartzcontrol, electron-builder.yml).
        PRODUCT_BUNDLE_IDENTIFIER: io.github.boxios.quartzhub
        PRODUCT_NAME: QuartzHub
        # No sandbox: QuartzHub runs node, npm and git in the user's project folders.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # App/QuartzHub.icon, made with Icon Composer (light, dark and tinted in one file).
        ASSETCATALOG_COMPILER_APPICON_NAME: QuartzHub

  QuartzHubUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: QuartzHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.boxios.quartzhub.uitests
        TEST_TARGET_NAME: QuartzHub
        GENERATE_INFOPLIST_FILE: YES

schemes:
  QuartzHub:
    build:
      targets:
        QuartzHub: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QuartzHubUITests
        - package: QuartzHubCore/QuartzHubCoreTests
